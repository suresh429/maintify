<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Flutter entry point for the Maintify website hosting target.
    Served at /login, /signup, /activate, /dashboard, etc. via Firebase
    Hosting rewrite (** → /app.html).  base href is hard-coded to "/" because
    all app routes live at the domain root.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Maintify — Manage. Maintain. Simplify. Apartment maintenance management made easy.">

  <!-- iOS PWA meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Maintify">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Theme color -->
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)">

  <!-- Favicon & manifest -->
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Maintify</title>
  <link rel="manifest" href="manifest.json">

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">

  <style id="splash-screen-style">
    html { height: 100%; }
    body {
      margin: 0;
      min-height: 100%;
      background-color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    @media (prefers-color-scheme: dark) {
      body { background-color: #0F172A; }
    }
    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>

  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      clearTimeout(window._splashWatchdog);
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>

  <script>
    // Capture the beforeinstallprompt event for Android PWA install.
    // Must be captured early — the event fires before Flutter initialises.
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.__pwaInstallPrompt = e;
    });

    // PWA standalone: collapse browser history so the back swipe cannot navigate
    // to a prior page (landing page, /activate, etc.) and show a raw splash.
    // replaceState keeps the current URL but removes all previous entries from
    // the in-app history stack, so "back" is a no-op inside the PWA.
    if (window.navigator.standalone === true) {
      history.replaceState(null, '', window.location.href);
    }

    // Service worker mid-session takeover guard.
    // When a new SW calls skipWaiting() it fires 'controllerchange'. If Flutter
    // is already running (splash removed), do NOT reload — that would interrupt
    // the user mid-session. Only reload if the splash is still visible, meaning
    // Flutter hasn't started yet and a reload is safe.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        var splashStillVisible = !!document.getElementById('splash');
        if (splashStillVisible && !sessionStorage.getItem('_sw_reload')) {
          sessionStorage.setItem('_sw_reload', '1');
          window.location.reload();
        }
      });
    }

    // Stuck-splash safety net for iOS Safari / PWA.
    // If Flutter hasn't dismissed the splash within 20 seconds, force one reload.
    // iOS Safari sometimes silently drops SW asset responses causing Flutter to hang.
    window._splashWatchdog = setTimeout(function() {
      if (document.getElementById('splash') && !sessionStorage.getItem('_sw_reload')) {
        sessionStorage.setItem('_sw_reload', '1');
        window.location.reload();
      }
    }, 20000);
  </script>
</head>
<body>
  <picture id="splash">
    <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
    <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
    <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>

  <script src="flutter_bootstrap.js" async=""></script>
</body>
</html>
